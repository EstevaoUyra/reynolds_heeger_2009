# Calibration ledger — IMPLEMENTATION-SIDE knobs (ARCHITECTURE.md §3).
#
# Phase B owns and writes this file. After the SQ-005 resolution (the
# suppression mechanism is now the authors' separable space×feature pool with
# σ=1e-6 and the near-flat θ pool, settled from the original author code) the
# per-panel 1D-discretization knobs that used to live here — suppressive_drive_gain,
# suppressive_spatial_sigma_scale, the per-panel baseline_* — are RETIRED (A-013,
# SQ-005). There is ONE suppression normalization for every panel, taken from the
# single cited/code constants in article_aware/spec/calibration.yaml; the model
# carries NO per-figure suppression gain or width scale.
#
# What remains here is genuinely implementation-side and NOT a suppression knob:
#   - model.normalization_variant: the §1 variants-as-config selector for the
#     §5(4) modification smoke test (config-only stage swap).
#   - figure_1.*: the Figure-1 1D-readout geometry (recorded-neuron coordinate),
#     a display/readout choice, not a scientific suppression parameter. The
#     Figure-1 stimulus/attention/field SIZES are all paper/code-derived and read
#     from the article_aware ledger (CODE-019).
#   - regime.*: the hermann2010 cross-model reuse surface — selects the Fig-2A
#     (contrast-gain) vs Fig-2B (response-gain) GEOMETRY (Table-1 sizes), the only
#     thing that distinguishes the two regimes under the faithful (no-gain)
#     mechanism. No suppression knob crosses the boundary.
#
# Namespacing: <protocol>.<param>: { value, units, source, audited, note }.

schema_version: 1

# ---------------------------------------------------------------------------
# Normalization stage selector (ARCHITECTURE.md §1 variants-as-config;
# §5(4) modification smoke test). The default "divisive" is the paper's
# Eq. 5. A scientist swaps the normalization stage by editing ONLY this key
# (or RH_NORMALIZATION_VARIANT). Allowed: divisive | identity_suppression.
# ---------------------------------------------------------------------------

model.normalization_variant:
  value: "divisive"
  units: "categorical (stage variant selector)"
  source: A-006
  audited: true
  note: "Selects the normalization stage variant. 'divisive' = paper Eq. 5 (default, behavior-preserving). 'identity_suppression' = trivial swap variant for the §5(4) modification smoke test (drops S). Config-only; never a code edit."

# ---------------------------------------------------------------------------
# Figure 1 — 1D-readout geometry only. The stimulus/attention/field SIZES and
# σ are CODE-019 / article_aware (stim ±100, AxWidth=30, γ=2, ExWidth=5,
# EthetaWidth=60, IxWidth=20, IthetaWidth=360, σ=1e-6). The keys below are the
# readout coordinate for the 1D slice — a display choice, not a scientific knob.
# ---------------------------------------------------------------------------

figure_1.recorded_x:
  value: 100.0
  units: "arbitrary spatial units"
  source: [A-006, CODE-019]
  audited: false
  note: "Recorded-neuron x for the Figure-1 1D readout = the attended RIGHT stimulus location (x=+100, CODE-019)."
figure_1.stim_left_x:
  value: -100.0
  units: "arbitrary spatial units"
  source: CODE-019
  audited: true
  note: "Left (unattended) stimulus position (stimCenter2 = -100, CODE-019)."
figure_1.stim_right_x:
  value: 100.0
  units: "arbitrary spatial units"
  source: CODE-019
  audited: true
  note: "Right (attended) stimulus position (stimCenter1 = +100, CODE-019)."
figure_1.stim_contrast:
  value: 1.0e-4
  units: "contrast (c in [0,1])"
  source: assumed-consistent
  audited: false
  note: |
    Figure-1 render contrast. The authors' Test/debug R1 call (CODE-019) uses makeGaussian
    height=1 (contrast=1), but contrast=1 puts the model on the scale-invariant plateau
    where R = E·A/pool(E·A) cancels attention's boost — producing R_right/R_left ≈ 1.01,
    invisible in the render. The printed Figure 1 shows clearly visible right>left in R.
    At c=1e-4 the model is on the rising limb (I ≈ σ=1e-6), σ breaks scale-invariance,
    and R_right/R_left ≈ 1.89 — a visible asymmetry. The debug call's contrast is not the
    figure-generating value. All other CODE-019 parameters (grid, positions, AxWidth,
    gamma, IxWidth, IthetaWidth, sigma) are unchanged.
figure_1.attention_spatial_center:
  value: 100.0
  units: "arbitrary spatial units"
  source: CODE-019
  audited: true
  note: "Spatial center of the Figure-1 attention field (Ax = stimCenter1 = +100, CODE-019)."

# ---------------------------------------------------------------------------
# Formalized calibrated 1D-CRF entry point (rh_model.crf_protocol.run_crf) —
# the hermann2010 cross-model reuse surface. Under the faithful (no-gain)
# suppression mechanism the contrast-gain vs response-gain distinction is the
# Fig-2A vs Fig-2B GEOMETRY (Table 1): contrast gain = a large attention field
# over a small stimulus; response gain = a small attention field over a larger
# stimulus. The regime selects that geometry internally so the dependent passes
# only a regime NAME and carries no R&H discretization knob. No suppression knob
# is exposed or applied per-regime (A-013).
# ---------------------------------------------------------------------------

regime.contrast_gain.attention_field_size:
  value: 30.0
  units: "arbitrary spatial units (Gaussian σ)"
  source: [C-013, CODE-018]
  audited: true
  note: "Contrast-gain regime attention-field σ = Fig-2A value 30 (Table 1). Large attention field over a small stimulus => contrast-gain left-shift."
regime.contrast_gain.stimulus_size:
  value: 3.0
  units: "arbitrary spatial units (Gaussian σ)"
  source: [C-013, CODE-018]
  audited: true
  note: "Contrast-gain regime stimulus σ = Fig-2A value 3 (Table 1)."
regime.response_gain.attention_field_size:
  value: 3.0
  units: "arbitrary spatial units (Gaussian σ)"
  source: [C-013, CODE-018]
  audited: true
  note: "Response-gain regime attention-field σ = Fig-2B value 3 (Table 1). Small attention field over a larger stimulus => response-gain upward-shift."
regime.response_gain.stimulus_size:
  value: 5.0
  units: "arbitrary spatial units (Gaussian σ)"
  source: [C-013, CODE-018]
  audited: true
  note: "Response-gain regime stimulus σ = Fig-2B value 5 (Table 1)."
