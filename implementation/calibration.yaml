# Calibration ledger — IMPLEMENTATION-SIDE knobs (ARCHITECTURE.md §3).
#
# Phase B owns and writes this file. These are the 1D-discretization /
# per-protocol calibration values that used to be scattered as numeric
# literals in implementation/src/rh_model/protocols.py dicts: the
# suppressive_drive_gain, suppressive_spatial_sigma_scale, baseline_*,
# per-protocol sigma / suppressive_tuning_width overrides, and the
# Figure-1 1D spatial-display geometry. This is the home for the
# SQ-001 / SQ-002 / SQ-004 class.
#
# source: A-006 | SQ-NNN. audited: false for everything tied to an open
# spec question (the human audits the LEDGER, not the code; a high
# unaudited count is honest containment, not a defect — §3).
#
# Migration note: every value here is byte-identical to the pre-migration
# literal it replaces. Relocation only; no model behavior change, no test
# semantics changed.
#
# Namespacing: <protocol>.<param>: { value, units, source, audited, note }.
# A formalized calibrated 1D-CRF entry point (rh_model.crf_protocol) reads
# the regime.* keys so a dependent never sees or carries these.

schema_version: 1

# ---------------------------------------------------------------------------
# Normalization stage selector (ARCHITECTURE.md §1 variants-as-config;
# §5(4) modification smoke test). The default "divisive" is the paper's
# Eq. 5 and is byte-for-behavior identical to the pre-migration path.
# A scientist swaps the normalization stage by editing ONLY this key
# (or RH_NORMALIZATION_VARIANT) — zero edits to protocols/measurements/
# views/stage code. Allowed: divisive | identity_suppression.
# ---------------------------------------------------------------------------

model.normalization_variant:
  value: "divisive"
  units: "categorical (stage variant selector)"
  source: A-006
  audited: true
  note: "Selects the normalization stage variant. 'divisive' = paper Eq. 5 (default, behavior-preserving). 'identity_suppression' = trivial swap variant for the §5(4) modification smoke test (drops S). Config-only; never a code edit."

# ---------------------------------------------------------------------------
# Figure 1 — 1D spatial-display geometry for the schematic population fields.
# These are NOT scientific parameters; they shape the 1D reduction of the
# 2D Figure-1 schematic so the four population panels render legibly. SQ
# class (display calibration, A-006).
# ---------------------------------------------------------------------------

figure_1.sigma:
  value: 1.5
  units: "contrast (c in [0,1])"
  source: A-006
  audited: false
  note: "Figure-1-only sigma so the schematic R field is legible at the displayed contrasts (display calibration; not the spec sigma 0.1)."
figure_1.stimulus_spatial_sigma_scale:
  value: 0.5
  units: "dimensionless (effective-width scale on stimulus spatial Gaussian)"
  source: A-006
  audited: false
  note: "1D effective-width scale narrowing the Figure-1 stimulus stripes for the schematic."
figure_1.attention_spatial_sigma_scale:
  value: 0.7166666666666667
  units: "dimensionless (effective-width scale on attention spatial Gaussian)"
  source: A-006
  audited: false
  note: "= 21.5/30.0 (pre-migration literal). Effective attention-field width for the Figure-1 schematic."
figure_1.suppressive_spatial_sigma_scale:
  value: 0.2
  units: "dimensionless (effective-width scale on suppressive spatial Gaussian)"
  source: A-006
  audited: false
  note: "1D effective-width scale so the Figure-1 suppressive drive shows two hemifield bands rather than one merged blob."
figure_1.recorded_x:
  value: 10.0
  units: "arbitrary spatial units"
  source: A-006
  audited: false
  note: "Recorded-neuron x for the Figure-1 readout (the attended right stimulus location)."
figure_1.stim_left_x:
  value: -10.0
  units: "arbitrary spatial units"
  source: A-006
  audited: false
  note: "Left stimulus position in the 1D Figure-1 layout."
figure_1.stim_right_x:
  value: 10.0
  units: "arbitrary spatial units"
  source: A-006
  audited: false
  note: "Right (attended) stimulus position in the 1D Figure-1 layout."
figure_1.stim_contrast:
  value: 0.5
  units: "contrast (c in [0,1])"
  source: A-006
  audited: false
  note: "Equal contrast of both Figure-1 schematic gratings."
figure_1.attention_spatial_center:
  value: 10.0
  units: "arbitrary spatial units"
  source: A-006
  audited: false
  note: "Spatial center of the Figure-1 attention field (over the attended right stimulus)."

# ---------------------------------------------------------------------------
# Figure 2 — 1D suppressive-pooling + baseline calibration (SQ-001, SQ-002).
# ---------------------------------------------------------------------------

figure_2A.suppressive_drive_gain:
  value: 4.0
  units: "dimensionless (1D suppressive-drive scale)"
  source: SQ-001
  audited: false
  note: "1D discretized suppressive pooling makes S too small vs A*E; gain restores CRF saturation. Shared 2A/2B default."
figure_2A.suppressive_spatial_sigma_scale:
  value: 0.55
  units: "dimensionless (effective-width scale on suppressive spatial Gaussian)"
  source: SQ-001
  audited: false
  note: "2A contrast-gain: the cited suppressive spatial sigma is too broad for the 1D protocol so the CRF will not bend over within [0,1]; 0.55 pulls half-saturation below 1 without raising the SQ-001 gain."
figure_2A.baseline_unmodulated:
  value: 0.01
  units: "R&H response units (additive, post-normalization)"
  source: SQ-002
  audited: false
  note: "Small unmodulated baseline so the normalized CRFs have a finite low-contrast floor."

figure_2B.suppressive_drive_gain:
  value: 4.0
  units: "dimensionless (1D suppressive-drive scale)"
  source: SQ-001
  audited: false
  note: "Figure 2B suppressive-drive gain (response-gain regime); shared 2A/2B default."
figure_2B.suppressive_spatial_sigma_scale:
  value: 1.0
  units: "dimensionless (effective-width scale on suppressive spatial Gaussian)"
  source: SQ-001
  audited: false
  note: "Figure 2B keeps the unscaled suppressive width (response-gain regime needs no 1D width correction)."
figure_2B.baseline_unmodulated:
  value: 0.01
  units: "R&H response units (additive, post-normalization)"
  source: SQ-002
  audited: false
  note: "Small unmodulated baseline (shared 2A/2B default)."

# ---------------------------------------------------------------------------
# Figure 3 — 1D suppressive-pooling + baseline calibration (SQ-001, SQ-002).
# ---------------------------------------------------------------------------

figure_3C.suppressive_drive_gain:
  value: 5.0
  units: "dimensionless (1D suppressive-drive scale)"
  source: SQ-001
  audited: false
  note: "Figure 3 suppressive-drive gain (shared 3C/3F default base)."
figure_3C.suppressive_spatial_sigma_scale:
  value: 0.45
  units: "dimensionless (effective-width scale on suppressive spatial Gaussian)"
  source: SQ-001
  audited: false
  note: "3C contrast-gain regime: effective suppressive width 0.45 lets attended/unattended CRFs converge at high contrast so the absolute difference falls below 75% of peak."
figure_3C.baseline_modulated_by_attention:
  value: 0.02
  units: "R&H response units (additive, pre-normalization, attention-modulated)"
  source: SQ-002
  audited: false
  note: "Figure 3C attention-modulated baseline (added to E)."
figure_3C.baseline_unmodulated:
  value: 0.1
  units: "R&H response units (additive, post-normalization)"
  source: SQ-002
  audited: false
  note: "Figure 3C unmodulated baseline (added to R)."

figure_3F.suppressive_drive_gain:
  value: 8.0
  units: "dimensionless (1D suppressive-drive scale)"
  source: SQ-001
  audited: false
  note: "Figure 3F response-gain regime suppressive-drive gain."
figure_3F.suppressive_spatial_sigma_scale:
  value: 1.0
  units: "dimensionless (effective-width scale on suppressive spatial Gaussian)"
  source: SQ-001
  audited: false
  note: "Figure 3F keeps the unscaled suppressive width (response-gain regime retains the larger high-contrast separation)."
figure_3F.baseline_modulated_by_attention:
  value: 0.05
  units: "R&H response units (additive, pre-normalization, attention-modulated)"
  source: SQ-002
  audited: false
  note: "Figure 3F attention-modulated baseline."
figure_3F.baseline_unmodulated:
  value: 0.05
  units: "R&H response units (additive, post-normalization)"
  source: SQ-002
  audited: false
  note: "Figure 3F unmodulated baseline."

# ---------------------------------------------------------------------------
# Figure 4 — 1D suppressive-pooling + the SQ-004 per-protocol suppressive
# tuning width (vs the cited C-011 180 deg).
# ---------------------------------------------------------------------------

figure_4C.suppressive_drive_gain:
  value: 8.0
  units: "dimensionless (1D suppressive-drive scale)"
  source: SQ-001
  audited: false
  note: "Figure 4C suppressive-drive gain."
figure_4C.sigma:
  value: 0.05
  units: "contrast (c in [0,1])"
  source: SQ-001
  audited: false
  note: "Figure-4C-only sigma override (two colocated stimuli; sharper half-saturation needed for the contrast-gain recovery claim)."
figure_4C.suppressive_tuning_width:
  value: 75.0
  units: "degrees"
  source: SQ-004
  audited: false
  note: "Per-protocol effective suppressive TUNING width for Figure 4C only (mid of the robust 60-90 deg green band). The cited C-011 180 deg leaves 4C unable to satisfy the contrast-gain recovery/saturation claims (Q-027/Q-029) and no other sanctioned knob moves it. Figure 4C green is PROVISIONAL, soft-blocked on SQ-004. article_aware/spec and the C-011 constant are left unchanged."

figure_4E.suppressive_drive_gain:
  value: 4.0
  units: "dimensionless (1D suppressive-drive scale)"
  source: SQ-001
  audited: false
  note: "Figure 4E suppressive-drive gain."

# ---------------------------------------------------------------------------
# Formalized calibrated 1D-CRF entry point (rh_model.crf_protocol.run_crf).
# A dependent (e.g. hermann2010) passes only scientific params + a regime
# name; the per-regime implementation-side calibration below is applied
# INTERNALLY so the dependent carries zero discretization knobs and zero
# regime-conditional. These regimes mirror the reproduced R&H Fig 2
# single-grating CRF panels (contrast_gain = Fig 2A; response_gain = Fig 2B).
# ---------------------------------------------------------------------------

regime.contrast_gain.suppressive_drive_gain:
  value: 4.0
  units: "dimensionless (1D suppressive-drive scale)"
  source: SQ-001
  audited: false
  note: "Contrast-gain regime 1D suppressive-drive gain (= reproduced R&H Fig 2A)."
regime.contrast_gain.suppressive_spatial_sigma_scale:
  value: 0.55
  units: "dimensionless (effective-width scale on suppressive spatial Gaussian)"
  source: SQ-001
  audited: false
  note: "Contrast-gain regime 1D effective suppressive-width scale (= reproduced R&H Fig 2A). This is the value the hermann leak carried as a regime-conditional literal; here it is internal to the entry point."
regime.contrast_gain.baseline_unmodulated:
  value: 0.01
  units: "R&H response units (additive, post-normalization)"
  source: SQ-002
  audited: false
  note: "Contrast-gain regime unmodulated baseline (= reproduced R&H Fig 2A)."

regime.response_gain.suppressive_drive_gain:
  value: 4.0
  units: "dimensionless (1D suppressive-drive scale)"
  source: SQ-001
  audited: false
  note: "Response-gain regime 1D suppressive-drive gain (= reproduced R&H Fig 2B)."
regime.response_gain.suppressive_spatial_sigma_scale:
  value: 1.0
  units: "dimensionless (effective-width scale on suppressive spatial Gaussian)"
  source: SQ-001
  audited: false
  note: "Response-gain regime keeps the unscaled suppressive width (= reproduced R&H Fig 2B). The dependent never sees that this differs from the contrast-gain regime."
regime.response_gain.baseline_unmodulated:
  value: 0.01
  units: "R&H response units (additive, post-normalization)"
  source: SQ-002
  audited: false
  note: "Response-gain regime unmodulated baseline (= reproduced R&H Fig 2B)."
