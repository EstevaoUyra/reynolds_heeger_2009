# ---------------------------------------------------------------------------

figure_4C.suppressive_drive_gain:
  value: 8.0
  units: "dimensionless (1D suppressive-drive scale)"
  source: SQ-001
  audited: false
  note: "Figure 4C suppressive-drive gain."

figure_4E.suppressive_drive_gain:
  value: 8.0
  units: "dimensionless (1D suppressive-drive scale)"
  source: SQ-001
  audited: false
  note: "Figure 4E suppressive-drive gain; raised 4->8 (2026-06-03 faithfulness fix) so the two-stimulus attend-pref/attend-nonpref CRFs genuinely saturate (plateau ~7-9%) rather than rising steeply at c=1. Multiplicative-scaling and ordering predicates preserved."

# ---------------------------------------------------------------------------
# Formalized calibrated 1D-CRF entry point (rh_model.crf_protocol.run_crf).
# A dependent (e.g. hermann2010) passes only scientific params + a regime
# name; the per-regime implementation-side calibration below is applied
# INTERNALLY so the dependent carries zero discretization knobs and zero
# regime-conditional. These regimes encode the contrast-gain / response-gain
# 1D suppressive-pool calibration in the SAME family as the R&H Fig-2
# single-grating panels, but they are a FROZEN cross-model reuse surface
# and are deliberately NOT slaved to the figure_2A/figure_2B figure knobs.
#
# Provenance note (2026-06-03 faithfulness fix): these regime values are the
# ORIGINAL Fig-2 single-grating calibration (gain 4, contrast-gain width
# 0.55, response-gain width 1.0). The figure_2A/figure_2B FIGURE protocols
# were subsequently retuned this round (2A gain 4->12, 2B gain 4->6) purely
# to make the *rendered* panels bend over more visibly; the regime surface
# was held at the original calibration ON PURPOSE so the dependent
# (hermann2010) behavior stays stable and is not silently perturbed by a
# cosmetic figure retune. They are therefore in the SAME REGIME as Fig 2A/2B
# but are NOT byte-identical to the current figure knobs — the earlier
# "= reproduced R&H Fig 2A" wording was stale and is corrected below. Both
# regimes still produce a saturating CRF (attended final/max log-slope ~0.64).
# ---------------------------------------------------------------------------

regime.contrast_gain.suppressive_drive_gain:
  value: 16.0
  units: "dimensionless (1D suppressive-drive scale)"
  source: SQ-001
  audited: false
  note: "Contrast-gain regime 1D suppressive-drive gain. Re-slaved 4->16 (2026-06-03 hermann2010 F1 / Q-104 fix). RATIONALE: this is the cross-model reuse surface hermann2010 consumes via run_crf; at the pre-faithfulness gain (4) the *unattended* 1D CRF was still rising toward c=1 and never plateaued, leaving a ~14% residual vertical gap at c=1 (hermann Fig-1b ign/att=0.857). hermann's Fig-1b is a PURE leftward shift onto a COMMON high-contrast plateau (digitized ign/att=0.9915), so the non-converging curve was unfaithful. The faithfulness fix that raised figure_2A.suppressive_drive_gain 4->12 was made for the SAME saturation reason but on the FIGURE surface only; 12 brings hermann to ign/att=0.940, still short of genuine convergence. Re-slaving here to 16 makes the unattended CRF genuinely saturate onto the common plateau (ign/att=0.954, att/ign=1.049) — clearing both the F1 convergence test (>=0.95) and the Q-104 tight-gap test (att/ign<=1.10) — while PRESERVING the contrast-gain signature (attended 3x rise + saturation retained, c50 leftward log-shift 0.196 still strong; gain>=~50 would erode both, so 16 is in the convergence-AND-signature window, NOT cranked to the 0.9915 digitized value which the 1D mechanism cannot reach without destroying the shift). Same Fig-2A regime family; deliberately ABOVE the figure_2A knob because hermann's tighter, paper-grounded convergence claim demands genuine saturation, not the figure panel's looser cosmetic plateau."
regime.contrast_gain.suppressive_spatial_sigma_scale:
  value: 0.55
  units: "dimensionless (effective-width scale on suppressive spatial Gaussian)"
  source: SQ-001
  audited: false
  note: "Contrast-gain regime 1D effective suppressive-width scale (Fig-2A-family value 0.55; matches the current figure_2A width). This is the value the hermann leak carried as a regime-conditional literal; here it is internal to the entry point."
regime.contrast_gain.baseline_unmodulated:
  value: 0.01
  units: "R&H response units (additive, post-normalization)"
  source: SQ-002
  audited: false
  note: "Contrast-gain regime unmodulated baseline (Fig-2A-family value 0.01; matches the current figure_2A baseline)."

regime.response_gain.suppressive_drive_gain:
  value: 4.0
  units: "dimensionless (1D suppressive-drive scale)"
  source: SQ-001
  audited: false
  note: "Response-gain regime 1D suppressive-drive gain. Original Fig-2B-family single-grating value (gain 4); NOT slaved to the retuned figure_2B.suppressive_drive_gain (now 6). Frozen here so the hermann2010 reuse surface is stable; see the namespace header."
regime.response_gain.suppressive_spatial_sigma_scale:
  value: 1.0
  units: "dimensionless (effective-width scale on suppressive spatial Gaussian)"
  source: SQ-001
  audited: false
  note: "Response-gain regime keeps the unscaled suppressive width (Fig-2B-family value 1.0; matches the current figure_2B width). The dependent never sees that this differs from the contrast-gain regime."
regime.response_gain.baseline_unmodulated:
  value: 0.01
  units: "R&H response units (additive, post-normalization)"
  source: SQ-002
  audited: false
  note: "Response-gain regime unmodulated baseline (Fig-2B-family value 0.01; matches the current figure_2B baseline)."
