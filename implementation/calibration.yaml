# ---------------------------------------------------------------------------
# Figure 2 — 1D suppressive-pooling + baseline calibration (SQ-001, SQ-002).
# ---------------------------------------------------------------------------

figure_2A.suppressive_drive_gain:
  value: 12.0
  units: "dimensionless (1D suppressive-drive scale)"
  source: SQ-001
  audited: false
  note: "1D discretized suppressive pooling makes S too small vs A*E so the CRF does not bend over; gain restores genuine CRF saturation (plateau). Raised 4->12 (2026-06-03 faithfulness fix): at gain 4 the unattended CRF was still rising ~22% from half-max to c=1, contradicting the paper's 'responses saturate at high stimulus contrasts'; 12 brings the plateau to ~10%. Shared 2A/2B default."
figure_2A.suppressive_spatial_sigma_scale:
  value: 0.55
  units: "dimensionless (effective-width scale on suppressive spatial Gaussian)"
  source: SQ-001
  audited: false
  note: "2A contrast-gain: the cited suppressive spatial sigma is too broad for the 1D protocol so the CRF will not bend over within [0,1]; 0.55 pulls half-saturation below 1 without raising the SQ-001 gain."
figure_2A.baseline_unmodulated:
  value: 0.01
  units: "R&H response units (additive, post-normalization)"
  source: SQ-002
  audited: false
  note: "Small unmodulated baseline so the normalized CRFs have a finite low-contrast floor."

figure_2B.suppressive_drive_gain:
  value: 6.0
  units: "dimensionless (1D suppressive-drive scale)"
  source: SQ-001
  audited: false
  note: "Figure 2B suppressive-drive gain (response-gain regime); raised 4->6 (2026-06-03 faithfulness fix) so the CRFs reach a high-contrast plateau (rise from half-max to c=1 ~23% vs ~30% at gain 4) while KEEPING the response-gain signature — attentional modulation stays sustained at high contrast (pm[-1] >= 0.45*peak, high-contrast mean modulation > 0.55x rising mean). A larger gain over-saturates and erodes that sustained high-contrast modulation, the defining 2B-vs-2A difference."
figure_2B.suppressive_spatial_sigma_scale:
  value: 1.0
  units: "dimensionless (effective-width scale on suppressive spatial Gaussian)"
  source: SQ-001
  audited: false
  note: "Figure 2B keeps the unscaled suppressive width (response-gain regime needs no 1D width correction)."
figure_2B.baseline_unmodulated:
  value: 0.01
  units: "R&H response units (additive, post-normalization)"
  source: SQ-002
  audited: false
  note: "Small unmodulated baseline (shared 2A/2B default)."

# ---------------------------------------------------------------------------
# Figure 3 — 1D suppressive-pooling + baseline calibration (SQ-001, SQ-002).
# ---------------------------------------------------------------------------

figure_3C.suppressive_drive_gain:
  value: 8.0
  units: "dimensionless (1D suppressive-drive scale)"
  source: SQ-001
  audited: false
  note: "Figure 3C suppressive-drive gain (kept at 8). With the lowered modulated baseline (0.005, see baseline_modulated_by_attention below) the contrast-gain-mix CRFs reach a genuine high-contrast plateau (final/max log-slope ~0.42). The contrast-gain left-shift (attended half-max below unattended) is preserved and is STRONGER than 3F's (Q-025)."
figure_3C.suppressive_spatial_sigma_scale:
  value: 0.45
  units: "dimensionless (effective-width scale on suppressive spatial Gaussian)"
  source: SQ-001
  audited: false
  note: "3C contrast-gain regime: effective suppressive width 0.45 lets attended/unattended CRFs converge at high contrast so the absolute difference falls below 75% of peak."
figure_3C.baseline_modulated_by_attention:
  value: 0.005
  units: "R&H response units (additive, pre-normalization, attention-modulated)"
  source: SQ-002
  audited: false
  note: "Figure 3C attention-modulated baseline (added to E); lowered 0.02->0.005 (2026-06-03 faithfulness fix), same A-007-sanctioned tuning as Fig 3F. The modulated baseline is added UNIFORMLY to E (model_spec add_modulated_baseline_to_E) so a large value inflates the constant suppressive-pool floor and prevents the CRF from plateauing; 0.005 lets 3C genuinely saturate (final/max log-slope ~0.42). The contrast-gain signature is preserved: %-modulation peaks low, the absolute attended-unattended difference converges at high contrast, and 3C keeps a STRONGER low-contrast left shift than the response-gain 3F panel (Q-025), driven by 3C's larger attention field / smaller stimulus geometry (Table 1)."
figure_3C.baseline_unmodulated:
  value: 0.05
  units: "R&H response units (additive, post-normalization)"
  source: SQ-002
  audited: false
  note: "Figure 3C unmodulated baseline (added to R); set to 0.05 to match Fig 3F so the two Figure-3 panels share a baseline floor and differ only by geometry + the response-gain/contrast-gain suppressive width (A-007-sanctioned)."

figure_3F.suppressive_drive_gain:
  value: 12.0
  units: "dimensionless (1D suppressive-drive scale)"
  source: SQ-001
  audited: false
  note: "Figure 3F response-gain regime suppressive-drive gain (kept at 12). With the lowered modulated baseline (0.005, see baseline_modulated_by_attention below) this gain makes the suppressive drive S grow fast enough with contrast that the response-gain CRF bends over within [0.01,1]. The primary saturation lever this round was the modulated-baseline fix, not the gain. Response-gain CRFs still plateau more gently than the contrast-gain panels and the percent-modulation peak stays in the low-contrast half (< n/2), matching the paper's Fig 3F."
figure_3F.suppressive_spatial_sigma_scale:
  value: 0.7
  units: "dimensionless (effective-width scale on suppressive spatial Gaussian)"
  source: SQ-001
  audited: false
  note: "Figure 3F effective suppressive width narrowed 1.0->0.7 (2026-06-03 faithfulness fix) so S grows fast enough that the response-gain CRF bends over within [0.01,1]; the attended/unattended high-contrast separation and the sustained modulation that distinguish the response-gain regime are preserved."
figure_3F.baseline_modulated_by_attention:
  value: 0.005
  units: "R&H response units (additive, pre-normalization, attention-modulated)"
  source: SQ-002
  audited: false
  note: "Figure 3F attention-modulated baseline; lowered 0.05->0.005 (2026-06-03 faithfulness fix). Per A-007 this baseline is provisional and tuned per-protocol to match the paper's qualitative 3F shape. The modulated baseline is added UNIFORMLY to E (model_spec step add_modulated_baseline_to_E) so at 0.05 it injected a large CONSTANT floor into the suppressive pool S (S(c=0.01) was inflated from ~0.01 to ~0.6), which made the response-gain CRF rise near-linearly-in-log to c=1 with no high-contrast plateau (audit final/max log-slope ~0.94), contradicting the paper's 'responses saturate at high stimulus contrasts.' At 0.005 the constant-S floor is negligible so S grows with contrast and the CRF genuinely bends over (slope ~0.38, comparable to Fig 2A) while the 3F signatures are preserved: %-modulation still peaks at low contrast, absolute difference still peaks high, and 3F keeps a larger high-contrast attended-unattended separation than 3C."
figure_3F.baseline_unmodulated:
  value: 0.05
  units: "R&H response units (additive, post-normalization)"
  source: SQ-002
  audited: false
  note: "Figure 3F unmodulated baseline."

