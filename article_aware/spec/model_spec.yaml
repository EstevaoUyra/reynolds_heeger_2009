# Structured specification of the Reynolds & Heeger (2009) Normalization Model
# of Attention. Schema is the Pydantic ModelSpec; see DESIGN.md §5.
#
# Constants from the paper (cited) and underspecified values (linked to
# assumptions in assumptions.yaml) live in `parameters`. Per-figure values
# live in `simulation_protocols.parameter_overrides`.

name: "Reynolds & Heeger 2009 — Normalization Model of Attention"
paper_citation: "Reynolds JH, Heeger DJ. The Normalization Model of Attention. Neuron. 2009 Jan 29;61(2):168-185. doi:10.1016/j.neuron.2009.01.002"

state_variables:
  - id: E
    name: stimulus_drive
    description: "Excitatory drive to a neuron with RF center x and feature preference θ, evoked by the stimulus."
    domain: "(x, θ)"
    citation_refs: [C-001, C-009]

  - id: S
    name: suppressive_drive
    description: "Suppressive drive: suppressive field convolved with the (attention-modulated) stimulus drive."
    domain: "(x, θ)"
    citation_refs: [C-002, C-006]

  - id: A
    name: attention_field
    description: "Attentional gain (≥ 1) as a function of receptive field center and feature preference."
    domain: "(x, θ)"
    citation_refs: [C-005]

  - id: R
    name: output_firing_rate
    description: "Output firing rate at (x, θ) after divisive normalization and rectification."
    domain: "(x, θ)"
    citation_refs: [C-001, C-005]

parameters:

  # --- Underspecified globals (resolved via assumptions) ---

  - id: sigma
    name: contrast_gain_constant
    description: "Constant in normalization denominator; sets contrast at half-maximum response."
    value: 0.1
    underspecified_by: A-001
    units: "contrast (c ∈ [0,1])"
    citation_refs: [C-001, C-003]

  - id: alpha
    name: response_gain
    description: "Maximum attainable firing rate; multiplicative output scale."
    value: 1.0
    underspecified_by: A-002
    units: "arbitrary"
    citation_refs: [C-003]

  - id: threshold_T
    name: rectification_threshold
    description: "Threshold for ⌊·⌋_T; values below are clipped to 0."
    value: 0.0
    underspecified_by: A-003
    units: "arbitrary"
    citation_refs: [C-001]

  - id: beta
    name: surround_suppression_scale
    description: "Scale on surround contribution in closed-form CRFs (Eqs. 4, 8). Not used by full convolution-based simulations."
    value: 1.0
    underspecified_by: A-010
    units: "dimensionless"
    citation_refs: [C-004, C-008]

  - id: x_grid
    name: spatial_grid
    description: "Sample grid for spatial dimension x. Same grid for stimuli, fields, and outputs."
    value: null
    underspecified_by: A-005
    units: "arbitrary spatial units"
    citation_refs: []

  - id: theta_grid
    name: orientation_grid
    description: "Sample grid for feature dimension θ (orientation or motion direction)."
    value: null
    underspecified_by: A-008
    units: "degrees"
    citation_refs: []

  # --- Constants from paper (cited) ---

  - id: stimulation_field_size
    name: stimulation_field_size
    description: "Gaussian σ (per A-004) of the stimulation field; constant across all simulations."
    value: 5
    underspecified_by: null
    units: "arbitrary spatial units"
    citation_refs: [C-010]

  - id: suppressive_field_size
    name: suppressive_field_size
    description: "Gaussian σ of the suppressive field; constant across all simulations."
    value: 20
    underspecified_by: null
    units: "arbitrary spatial units"
    citation_refs: [C-010]

  - id: suppressive_tuning_width
    name: suppressive_field_orientation_tuning_width
    description: "Suppressive field tuning width (broad/nonspecific). 180° for V4 oriented gratings; doubled for MT/MST motion directions."
    value: 180
    underspecified_by: null
    units: "degrees"
    citation_refs: [C-011]

  # --- Per-protocol parameters (no global value; set in protocol overrides) ---

  - id: stimulus_size
    name: stimulus_size
    description: "Gaussian σ of the stimulus spatial profile. Per-figure; see protocol overrides."
    value: null
    underspecified_by: null
    units: "arbitrary spatial units"
    citation_refs: [C-013, C-014, C-015, C-016, C-017, C-018]

  - id: attention_field_size
    name: attention_field_size
    description: "Gaussian σ of the attention field's spatial extent. Per-figure."
    value: null
    underspecified_by: null
    units: "arbitrary spatial units"
    citation_refs: [C-013, C-014, C-015, C-016, C-017, C-018]

  - id: tuning_width
    name: feature_tuning_width
    description: "Gaussian σ_θ of the orientation/direction tuning of the stimulation field (and the attention field when feature-selective). Per-figure."
    value: null
    underspecified_by: null
    units: "degrees"
    citation_refs: [C-011, C-015, C-017, C-018]

  - id: peak_attention_gain_gamma
    name: peak_attention_gain
    description: "Peak gain γ (≥ 1) of the attention field. Per-figure ('Peak Mod' column in Table 1; values 2 or 5)."
    value: null
    underspecified_by: null
    units: "dimensionless"
    citation_refs: [C-007, C-012, C-013, C-014, C-015, C-016, C-017, C-018]

equations:
  - id: EQ-1
    name: output_firing_rate_no_attention
    expression: "R(x,θ) = ⌊E(x,θ) / (S(x,θ) + σ)⌋_T"
    inputs: [E, S, sigma, threshold_T]
    outputs: [R]
    citation_refs: [C-001]

  - id: EQ-2
    name: suppressive_drive
    expression: "S(x,θ) = s(x,θ) ∗ E(x,θ); ∫ s(x,θ) dx dθ = 1"
    inputs: [E]
    outputs: [S]
    citation_refs: [C-002]

  - id: EQ-3
    name: contrast_response_single_stimulus
    expression: "r(c) = αc / (c + σ)"
    inputs: [alpha, sigma]
    outputs: [R]
    citation_refs: [C-003]

  - id: EQ-4
    name: contrast_response_center_surround
    expression: "r(c) = αc / (c + βc_s + σ)"
    inputs: [alpha, sigma, beta]
    outputs: [R]
    citation_refs: [C-004]

  - id: EQ-5
    name: output_firing_rate_with_attention
    expression: "R(x,θ) = ⌊[A(x,θ) E(x,θ)] / (S(x,θ) + σ)⌋_T"
    inputs: [E, A, S, sigma, threshold_T]
    outputs: [R]
    citation_refs: [C-005]

  - id: EQ-6
    name: suppressive_drive_with_attention
    expression: "S(x,θ) = s(x,θ) ∗ [A(x,θ) E(x,θ)]"
    inputs: [E, A]
    outputs: [S]
    citation_refs: [C-006]

  - id: EQ-7
    name: contrast_gain_regime
    expression: "r(c) = α(γc) / (γc + σ) = αc / (c + σ/γ)"
    inputs: [alpha, sigma, peak_attention_gain_gamma]
    outputs: [R]
    citation_refs: [C-007]

  - id: EQ-8
    name: response_gain_regime
    expression: "r(c) = α(γc) / (γc + βc + σ)"
    inputs: [alpha, sigma, beta, peak_attention_gain_gamma]
    outputs: [R]
    citation_refs: [C-008]

  - id: EQ-stim
    name: stimulus_drive_construction
    expression: "E(x,θ) = Σ_i c_i · G_stim(x - x_i; σ=stimulus_size) · G_orient(θ - θ_i; σ=tuning_width)"
    inputs: [stimulation_field_size, stimulus_size, tuning_width]
    outputs: [E]
    citation_refs: [C-009]
    notes: "Form not given explicitly in paper; per A-009. Sum is over stimuli i with contrasts c_i, positions x_i, feature values θ_i."

  - id: EQ-attention
    name: attention_field_construction
    expression: |
      A(x,θ) = 1 + (γ - 1) · G_space(x - x_attended; σ=attention_field_size)
                            · G_feature(θ - θ_attended; σ=attention_tuning_width)
      For unselective dimensions (e.g., "flat over θ"), the corresponding Gaussian
      is replaced by 1 (uniform). For "attend elsewhere" conditions where the
      attended location is far from the recorded neuron's RF, the spatial Gaussian
      contribution at the RF is negligible and A ≈ 1 over the RF.
    inputs: [attention_field_size, peak_attention_gain_gamma, tuning_width]
    outputs: [A]
    citation_refs: [C-005, C-009]
    notes: "Construction form is conventional (paper says 'Gaussian profiles'); baseline 1, peak γ. Gaussian σ convention per A-004."

  - id: EQ-suppressive_kernel
    name: suppressive_kernel_construction
    expression: |
      s(x,θ) = N · G_space(x; σ=suppressive_field_size)
                 · G_feature(θ; σ=suppressive_tuning_width)
      where N is chosen so that ∫∫ s(x,θ) dx dθ = 1.
    inputs: [suppressive_field_size, suppressive_tuning_width]
    outputs: [s]
    citation_refs: [C-002, C-009, C-011]
    notes: "s is fixed by parameters; does not depend on stimulus or attention. Normalized integral per EQ-2."

components:
  - id: stimulation_field
    name: Stimulation Field
    description: "Range of spatial positions and feature values over which a neuron is excited. Gaussian profile in space and feature."
    parameter_refs: [stimulation_field_size, tuning_width]
    equation_refs: [EQ-stim]
    citation_refs: [C-009]

  - id: suppressive_field
    name: Suppressive Field
    description: "Pooling kernel for normalization; broader than stimulation field; can be feature-nonspecific. Gaussian profile, normalized to integrate to 1."
    parameter_refs: [suppressive_field_size, suppressive_tuning_width]
    equation_refs: [EQ-2, EQ-6]
    citation_refs: [C-002, C-009, C-011]

  - id: attention_field
    name: Attention Field
    description: "Attentional gain ≥ 1 specified per neuron. Gaussian profile in space and feature. Variable spatial and feature extents per protocol; baseline value 1, peak γ."
    parameter_refs: [attention_field_size, peak_attention_gain_gamma]
    equation_refs: [EQ-5, EQ-6]
    citation_refs: [C-005, C-009]

  - id: normalization
    name: Divisive Normalization with Attention
    description: "Composes the components: attention-modulated stimulus drive divided by attention-modulated suppressive drive plus σ, then rectified at T."
    parameter_refs: [sigma, threshold_T]
    equation_refs: [EQ-5, EQ-6]
    citation_refs: [C-005, C-006]

pipeline:
  # Ordered computation steps that produce the recorded neuron's response from a
  # protocol's stimulus and attention configuration. Each step references an
  # equation. Optional steps run only when the protocol overrides the relevant
  # parameter. Convolutions: periodic in θ, zero-padded in x (per A-011).

  - step: 1
    name: build_suppressive_kernel
    description: "Construct the (constant) suppressive field kernel s(x,θ), normalized to integrate to 1. Computed once per simulation."
    equation_ref: EQ-suppressive_kernel
    inputs: [suppressive_field_size, suppressive_tuning_width, x_grid, theta_grid]
    outputs: [s]

  - step: 2
    name: build_stimulus_drive
    description: "Construct E(x,θ) by summing per-stimulus Gaussian contributions from the protocol's stimulus configuration."
    equation_ref: EQ-stim
    inputs: [stimulus_size, tuning_width, x_grid, theta_grid, "<protocol.stimuli>"]
    outputs: [E]

  - step: 2.5
    name: add_modulated_baseline_to_E
    optional: true
    applies_when: "protocol.parameter_overrides has baseline_modulated_by_attention"
    description: "Add a uniform baseline to E so that it gets multiplied by A (and contributes to S)."
    inputs: [E, baseline_modulated_by_attention]
    outputs: [E]

  - step: 3
    name: build_attention_field
    description: "Construct A(x,θ) per the protocol's attention condition: baseline 1 plus Gaussian peak γ at the attended location, with feature selectivity per protocol."
    equation_ref: EQ-attention
    inputs: [attention_field_size, peak_attention_gain_gamma, tuning_width, x_grid, theta_grid, "<protocol.attention_condition>"]
    outputs: [A]

  - step: 4
    name: compute_suppressive_drive
    description: "Element-wise multiply A and E, then convolve with the suppressive kernel s in both x (zero-padded) and θ (periodic)."
    equation_ref: EQ-6
    inputs: [s, A, E]
    outputs: [S]

  - step: 5
    name: compute_output
    description: "Element-wise compute R = (A·E) / (S + σ), then rectify at threshold T."
    equation_ref: EQ-5
    inputs: [A, E, S, sigma, threshold_T]
    outputs: [R]

  - step: 5.5
    name: add_unmodulated_baseline_to_R
    optional: true
    applies_when: "protocol.parameter_overrides has baseline_unmodulated"
    description: "Add a uniform unmodulated baseline to R after normalization and rectification."
    inputs: [R, baseline_unmodulated]
    outputs: [R]

  - step: 6
    name: extract_recorded_neuron_response
    description: "Read out R(x, θ) at the recorded neuron's coordinates (typically x = 0, θ = preferred = 0). For tuning-curve protocols, the recorded coordinates are fixed and the stimulus θ is swept."
    inputs: [R, "<protocol.recorded_neuron_coords>"]
    outputs: ["recorded_response"]

rendering_conventions:
  # Binding contract for how figure groups are normalized when rendered and when
  # compared to the digitized references (Finding 1,
  # logs/faithfulness_audit/improvement-pass-2026-06-03.md).

  - id: crf_shared_response_scale
    name: "CRF figure-groups render on ONE shared response scale"
    description: |
      Each CRF figure-GROUP is drawn on a SINGLE shared response axis across all
      its panels — NOT per-pair-renormalized to 1.0. The paper places Fig 2's 2A
      (plateau ~0.615) and 2B (attended plateau ~0.85) on ONE sub-1.0 axis; that
      ceiling difference (2B above 2A) IS the response-gain claim, and the
      digitized references encode it directly (panel_*_digitized.json values are
      on the shared sub-1.0 scale). Per-pair-to-1.0 normalization pins every
      panel's top curve to 1.0 and erases the cross-panel ceiling difference.
    groups:
      figure_2: [figure_2A, figure_2B]
      figure_3: [figure_3C, figure_3F]
      figure_4: [figure_4C, figure_4E]
    rule: |
      Normalize ALL CRF curves in a figure-group by ONE common scale (e.g. the
      max model response across every panel in the group, mapped onto the
      reference group's overall peak), so each panel's plateau renders at its
      TRUE relative height. Apply the SAME shared-scale rule to the reference
      render (the digitized curves are already on the shared scale; do not pass
      them through a per-pair normalizer). Do NOT divide each pair independently
      by its own max.
    applies_to:
      - "implementation views (Phase B): the CRF model panels and the digitized-reference render"
      - "extracted_data/rh_tier_helpers.norm_pair_shared / group_scale (the tier-test referent)"
    excludes: |
      Tuning-curve panels (5C/6C/7C) use shared-peak-WITHIN-panel normalization
      (norm_curves / _plot_tuning); they are single-panel and unaffected.
    citation_refs: [C-013, C-019]
    spec_refs:
      - "figures.figure_2 (panel_A_digitized.json / panel_B_digitized.json shared sub-1.0 scale)"
      - "extracted_data/rh_tier_helpers.py (norm_pair_shared, group_scale, CRF_FIGURE_GROUPS)"

