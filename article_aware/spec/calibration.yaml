# Figure-3 baselines — RESOLVED FROM CODE (SQ-005). Table 1 marks only 'X'; the
# authors' Figure3C.m / Figure3F.m give the numbers. These OVERTURN the spec's
# A-007 single-shared 0.05·α assumption: the code uses a tiny modulated baseline
# (5e-7, SHARED by 3C and 3F) and a LARGE unmodulated post-normalization baseline
# that DIFFERS (5 for 3C, 0 for 3F). baselineMod is added to the stimulus drive E
# (attention-modulated path); baselineUnmod is added after normalization
# (R = E/(I+σ) + baselineUnmod). CODE-ALONE.
figure_3C.baseline_modulated:
  value: 5.0e-7
  units: "stimulus-drive units (added to E)"
  source: [CODE-017]
  audited: true
  quote: "Figure3C.m:5  baselineMod = 5e-7;"
  note: "Figure 3C attention-modulated baseline, added to the stimulus drive E before normalization (CODE-017). Code-alone (Table 1 marks 'X' only). Shared with 3F."
figure_3C.baseline_unmodulated:
  value: 5.0
  units: "response units (added to R after normalization)"
  source: [CODE-017]
  audited: true
  quote: "Figure3C.m:6  baselineUnmod = 5;"
  note: "Figure 3C unmodulated baseline, added after normalization R = E/(I+σ) + baselineUnmod (CODE-017). Code-alone; on the R-scale that tops out ~20 this is a large floor (the Reynolds-2000 baseline-shift pattern). DIFFERS from 3F (0)."
figure_3F.baseline_modulated:
  value: 5.0e-7
  units: "stimulus-drive units (added to E)"
  source: [CODE-017]
  audited: true
  quote: "Figure3F.m:5  baselineMod = 5e-7;"
  note: "Figure 3F attention-modulated baseline (CODE-017). Same as 3C."
figure_3F.baseline_unmodulated:
  value: 0.0
  units: "response units (added to R after normalization)"
  source: [CODE-017]
  audited: true
  quote: "Figure3F.m:6  baselineUnmod = 0;"
  note: "Figure 3F unmodulated baseline = 0 (CODE-017). Code-alone. The per-panel 3C-vs-3F difference is in THIS term (5 vs 0), not the modulated baseline — overturning A-007's single-shared symmetric 0.05·α."

