# Calibration ledger — PAPER-DERIVED parameters only (ARCHITECTURE.md §3).
#
# Phase A owns this file; it is Phase-A-protected and Phase B reads only.
# Every entry here is a value the paper states or that follows from it
# (source: C-NNN), or a spec-resolved underspecified global whose value is
# fixed by an assumption (source: A-NNN). Implementation-side calibration
# (the 1D-discretization knobs, per-protocol suppressive/baseline overrides,
# the SQ-001/002/004 class) lives in implementation/calibration.yaml, NOT
# here.
#
# This file was introduced by the organizer-designated ARCHITECTURE
# migration. It only RELOCATES values that already lived in code/spec; it
# changes no test semantics and no claims. The numeric values are identical
# to the pre-migration ModelParams defaults and model_spec.yaml
# parameter_overrides.
#
# Namespacing: <stage_or_global>.<param>: { value, units, source, audited,
# note }.
#
# audited:true REQUIRES a verbatim `quote:` — the literal paper string the
# value is read from (Table 1 / the constants line of the paper). An
# audited:true with only a paraphrased note is a faithfulness defect
# (2026-06-03 process-audit fix): every per-figure scientific entry and the
# three cross-figure constants below now carry the verbatim Table 1 / paper
# string they are read from. The Table 1 source rows live verbatim in
# article_aware/spec/citations.yaml (C-010..C-018 `text:`) and in
# paper/extracted_text.md "Table 1 — Per-Figure Parameters".
#
# SUPPRESSION-NORMALIZATION RULE (resolved from ORIGINAL AUTHOR CODE, SQ-005,
# fix/sq005-from-code-20260604). The suppression normalization is ONE mechanism
# with single cross-figure constants. The authors' code (attentionModel.m,
# CODE-001/CODE-002) computes it as a SEPARABLE 2D CONVOLUTION over (space x,
# feature θ) — NOT over an invented orthogonal (x,y) plane (the retired A-006
# 2D-(x,y) reduction was empirically falsified; see SQ-005). The two suppressive
# kernels are UNIT-VOLUME 1D Gaussians (IxWidth=20 spatial, IthetaWidth=360
# feature), applied as conv2sepYcirc (zero-pad in x, circular in θ); they are NOT
# renormalized to a joint integral of 1. SATURATION COMES FROM THE POOLED I, NOT
# FROM σ: the code runs sigma=1e-6 ≈ 0 (CODE-014), so R = E/(I+σ) ≈ E/I plateaus
# once I ≫ σ (essentially all but the lowest contrasts). NO per-panel
# suppressive_drive_gain or suppressive_spatial_sigma_scale exists in the code —
# those are forbidden from this surface; the single mechanism with the cited/code
# constants produces the saturating CRFs directly.

schema_version: 1

# ---------------------------------------------------------------------------
# Underspecified globals — spec-resolved via assumptions (model_spec.yaml
# parameters; assumptions.yaml). Values are the model_spec defaults.
# ---------------------------------------------------------------------------

model.sigma:
  value: 1.0e-6
  units: "same units as the pooled suppressive drive I (≈ contrast·response)"
  source: [CODE-014]
  audited: true
  quote: "attentionModel.m:116-118  if notDefined('sigma')  sigma = 1e-6;  end"
  note: |
    RESOLVED FROM CODE (SQ-005). σ = 1e-6 ≈ 0 in the authors' code (CODE-014); no
    Figure*.m overrides it. The spec's prior σ=0.1 semi-saturation assumption (A-001)
    is OVERTURNED: saturation does NOT come from σ but from the pooled suppressive
    drive I (R = E/(I+σ) ≈ E/I once I ≫ σ). CODE-ALONE — the paper text we hold
    (C-003) presents σ qualitatively as a 'semi-saturation contrast' and gives no
    number; the code shows it is set ≈0. audited:true on the verbatim code line
    (CODE-NNN ground truth), not a paper quote. A-001 is superseded for the full
    simulation; the closed-form CRFs (EQ-3/EQ-7) still carry σ symbolically.

model.alpha:
  value: 1.0
  units: "arbitrary"
  source: A-002
  audited: false  # downgraded: not a verbatim paper quote (corpus process-audit 2026-06-03)
  note: "Response gain / max attainable rate (model_spec parameters.alpha; A-002)."

model.threshold_T:
  value: 0.0
  units: "arbitrary"
  source: A-003
  audited: false  # downgraded: not a verbatim paper quote (corpus process-audit 2026-06-03)
  note: "Rectification threshold for the half-wave operator (model_spec parameters.threshold_T; A-003)."

model.beta:
  value: 1.0
  units: "dimensionless"
  source: A-010
  audited: false  # downgraded: not a verbatim paper quote (corpus process-audit 2026-06-03)
  note: "Surround suppression scale; used only by closed-form CRFs, not the full simulation (model_spec parameters.beta; A-010)."

# ---------------------------------------------------------------------------
# Constants from the paper (cited).
# ---------------------------------------------------------------------------

model.stimulation_field_size:
  value: 5.0
  units: "arbitrary spatial units (Gaussian sigma, A-004)"
  source: [C-010, CODE-012]
  audited: true
  quote: "Constants for all simulations: stimulation field size = 5, suppressive field size = 20. [code: attentionModel.m:83-85 ExWidth = 5]"
  note: "Stimulation field SPATIAL σ = 5, constant across all simulations (paper Table 1, C-010; confirmed in authors' code ExWidth default, CODE-012). Distinct from the per-figure STIMULUS Gaussian σ (stimWidth in Figure*.m), which is the figure_*.stimulus_size entries below."

model.stimulation_tuning_width:
  value: 60.0
  units: "degrees"
  source: [CODE-013]
  audited: true
  quote: "attentionModel.m:86-88  if notDefined('EthetaWidth')  EthetaWidth = 60;  end"
  note: |
    RESOLVED FROM CODE (SQ-005 pass). Stimulation field FEATURE σ default = 60° (CODE-013,
    the doubled MT/MST value); no Figure*.m overrides EthetaWidth. CODE-ALONE: the paper
    text we hold (C-011) quotes 30° for V4 oriented gratings. NOTE: the per-figure
    figure_*.tuning_width entries below are the ATTENTION-field feature tuning widths
    (AthetaWidth in Figure*.m, = Table 1) — a different kernel from this stimulation-field
    feature width, which the code holds fixed at 60° throughout.

model.suppressive_field_size:
  value: 20.0
  units: "arbitrary spatial units (Gaussian sigma, A-004)"
  source: [C-010, CODE-010]
  audited: true
  quote: "Constants for all simulations: stimulation field size = 5, suppressive field size = 20. [code: attentionModel.m:89-91 IxWidth = 20]"
  note: "Suppressive field SPATIAL σ = 20, constant across all simulations (paper Table 1, C-010; confirmed in authors' code IxWidth default, CODE-010). This is the IxWidth (spatial) suppressive kernel σ — the FEATURE suppression width is separate (see model.suppressive_tuning_width)."

model.suppressive_tuning_width:
  value: 360.0
  units: "degrees"
  source: [CODE-011]
  audited: true
  quote: "attentionModel.m:92-94  if notDefined('IthetaWidth')  IthetaWidth = 360;  end"
  note: |
    RESOLVED FROM CODE (SQ-005). The authors' code default for the suppressive FEATURE
    (orientation/direction) tuning width is IthetaWidth = 360° (CODE-011) — the doubled
    MT/MST value — and NO Figure*.m script overrides it, so EVERY figure uses 360°. The
    paper text we hold (C-011) quotes 180° for V4 oriented gratings (doubled for MT/MST);
    the code runs the 360° doubled value across the board. CODE-ALONE for the running
    value. This near-flat θ pool (σ=360° ≫ the 361-sample θ span) is the mechanism that
    pools essentially ALL orientations into the suppressive drive I, making S commensurate
    with A·E so the CRFs saturate (the SQ-005 fix). ONE value for every figure; no per-panel
    override (the Figure-4C 75° override, SQ-004, stays RETIRED). NOTE the kernels are
    unit-volume Gaussians, NOT jointly integral-normalized (CODE-002): on the code grid the
    IthetaKernel sums to ~0.384, the IxKernel to 1.0.

