    - "C-017 (Fig-6 spatial attention away from RF; feature attention selective)"
    - "CODE-018 (Figure6C.m Ashape='cross', Ax=-100, AxWidth=30, AthetaWidth=60; attentionModel.m:146-162 the additive separable 'cross' construction)"
