# Assumptions made where the paper underspecifies.
#
# Each assumption is referenced by ID from model_spec.yaml (parameters with
# value: null point to an assumption via underspecified_by), and from code
# docstrings (Assumption:) once implementation begins.
#
# Format: name (snake_case identifier), description (what was assumed),
# rationale (why), alternatives_considered (other plausible choices),
# affects (where this assumption propagates), spec_refs (cross-references).

- id: A-001
  name: contrast_gain_constant_sigma
  description: |
    SUPERSEDED BY CODE (SQ-005, fix/sq005-from-code-20260604; see CODE-014).
    The assumption was σ = 0.1; the authors' code sets σ = 1e-6 ≈ 0
    (attentionModel.m:116-118), and no figure script overrides it. The binding
    full-simulation value is now σ = 1e-6 (calibration.yaml model.sigma,
    model_spec parameters.sigma, source CODE-014). Retained here only as the
    record of the prior (wrong) assumption and its blast radius.
  rationale: |
    SUPERSEDED. The original reasoning (σ=0.1 ⇒ half-saturation at ~10% contrast)
    assumed σ sets the contrast at half-maximum. The code shows this is NOT how the
    model saturates: with σ≈0, R = (A·E)/(S + σ) ≈ (A·E)/S, and SATURATION COMES
    FROM THE POOLED SUPPRESSIVE DRIVE S (which scales with contrast, so R plateaus
    once S ≫ σ). σ only sets the very-low-contrast knee where S ≈ σ. σ still
    appears symbolically in the closed-form CRFs EQ-3/EQ-7 (single-neuron analysis),
    where it plays the textbook semi-saturation role, but the full population
    simulation uses σ ≈ 0.
  alternatives_considered:
    - "σ = 0.1 (the RETIRED assumption; wrong — see CODE-014)"
    - "σ = 0.5 / 0.01 / 1.0 (all moot: code value is 1e-6)"
  affects:
    - "EQ-3, EQ-7 (closed-form CRFs still carry σ symbolically)"
    - "SUPERSEDED for EQ-1/EQ-5/EQ-8 full simulation (σ≈0; saturation from S)"
  spec_refs:
    - "parameters.sigma"
    - "CODE-014 (σ = 1e-6, the binding code value)"
    - "logs/spec_questions.md SQ-005 (resolution)"

- id: A-002
  name: response_gain_alpha
  description: |
    Numeric value of α (response gain; max attainable response) is not
    specified. Choose α = 1 (dimensionless).
  rationale: |
    Paper treats output units as arbitrary (Table 1 notes: "spatial
    sizes in arbitrary units"). With α = 1, output ranges in [0, ~γ]
    for attention conditions, making qualitative comparisons easy and
    avoiding confusion about firing rate units that are not specified.
  alternatives_considered:
    - "α = 100 (interpret as spikes/s)"
  affects:
    - "EQ-1, EQ-3, EQ-5, EQ-7, EQ-8"
    - "All simulation outputs (uniform multiplicative scale only)"
  spec_refs:
    - "parameters.alpha"

- id: A-003
  name: rectification_threshold_T
  description: |
    Value of T in the rectification operator ⌊·⌋_T is not given. Choose
    T = 0 (half-wave rectification).
  rationale: |
    Half-wave rectification at T = 0 is the standard interpretation of
    ⌊·⌋_T in the divisive normalization literature (Heeger 1992; Carandini
    & Heeger 1994). Output of the divisive form is non-negative for all
    valid inputs (E ≥ 0, S ≥ 0, σ > 0), so T = 0 affects only edge
    cases involving subtracted baselines.
  alternatives_considered:
    - "T > 0 (subtract spontaneous baseline before rectification)"
  affects:
    - "EQ-1, EQ-5"
  spec_refs:
    - "parameters.threshold_T"

- id: A-004
  name: gaussian_size_convention
  description: |
    Paper specifies sizes (e.g., "stimulation field size = 5") without
    stating whether 'size' refers to standard deviation σ_g, FWHM, or
    full extent. Adopt convention: 'size' = standard deviation σ_g of
    the Gaussian profile.
  rationale: |
    σ_g convention is the most common in vision and computational
    neuroscience modeling, and Table 1 ratios (e.g., stimulus = 0.6 ×
    stimulation field) are most naturally interpreted as σ_g ratios.
    Under this convention, a "size = 5" stimulus has full extent
    ~3σ_g = 15 units (covering ~99.7% of the Gaussian mass).
  alternatives_considered:
    - "FWHM (size = 2.355 σ_g)"
    - "Full extent at some cutoff (e.g., 2σ_g or 3σ_g)"
  affects:
    - "All Gaussian profile constructions"
    - "components.stimulation_field"
    - "components.suppressive_field"
    - "components.attention_field"
    - "EQ-stim"
  spec_refs:
    - "components.stimulation_field"
    - "components.suppressive_field"
    - "components.attention_field"

- id: A-005
  name: spatial_discretization
  description: |
    Spatial sample grid for x is not specified. Use x ∈ [-100, 100] with
    401 points (dx = 0.5).
  rationale: |
    Grid must (i) extend beyond the suppressive field (size = 20) and
    beyond the largest attention field (size = 30) so that "opposite
    hemifield" attention conditions can be placed far enough that A ≈ 1
    over the recorded neuron's RF (need distance >> 3σ_attn = 90), and
    (ii) resolve the smallest stimulus (size 0.6 × 5 = 3) — dx = 0.5
    gives 6 samples per σ_g.
  alternatives_considered:
    - "[-50, 50] with dx = 0.5 (initial choice; too small for figure 2A geometry)"
    - "[-100, 100] with dx = 1.0 (faster; risk of undersampling small stimuli)"
    - "[-200, 200] (overkill)"
    - "y axis (A-006 2D plane): use the SAME [-100, 100] / dx = 0.5 grid for y as for x, so the suppressive pool integrates over a symmetric 2D plane. Single-axis protocols place stimuli at y = 0; the pool still spans y."
  affects:
    - "All spatial convolutions (EQ-2, EQ-6) over the (x, y) plane"
    - "components.stimulation_field, components.suppressive_field"
  spec_refs:
    - "parameters.x_grid"
    - "parameters.y_grid"
    - "A-006 (2D-plane suppressive pooling)"

- id: A-006
  name: spatial_dimensionality
  description: |
    SUPERSEDED BY ORIGINAL AUTHOR CODE (SQ-005, fix/sq005-from-code-20260604).
    This assumption went through two wrong forms; the code settles it. The model
    has NO orthogonal spatial y axis and NO joint 2D-(x,y) integral normalization.

    WRONG FORM 1 (the original 1D reduction): suppression as a 1D-line
    convolution in x with σ=0.1 — under-pooled, no saturation, patched with
    figure-fitted per-panel gains.
    WRONG FORM 2 (phaseA-contract-update-2026-06-03): an invented orthogonal y
    axis with s(x,y,θ) integral-normalized over a 2D (x,y) image plane (∫∫∫ s = 1).
    EMPIRICALLY FALSIFIED in SQ-005: a 2D-(x,y) integral-normalized Gaussian has
    LOWER peak density than the 1D one, so it made S SMALLER, not larger — it
    deepened the deficit (measured 1D S/AE ≈ 0.243, genuine-2D ≈ 0.059).

    BINDING SPEC (from the authors' code, attentionModel.m:171, CODE-001):
    The suppressive drive is a SEPARABLE 2D CONVOLUTION over (SPACE x, FEATURE θ):
        I = conv2sepYcirc(A·E, IxKernel, IthetaKernel)
    with IxKernel = unit-volume Gaussian σ=IxWidth=20 (CODE-010, zero-padded in x)
    and IthetaKernel = unit-volume Gaussian σ=IthetaWidth=360 (CODE-011, circular
    in θ). The kernels are NOT renormalized to a joint integral of 1 (CODE-002);
    each 1D factor is unit-volume. The mechanism that makes S commensurate with
    A·E — so the CRFs saturate (C-020) — is the BROAD/NEAR-FLAT θ pool
    (IthetaWidth=360° ≫ the θ span), which pools essentially ALL orientations
    into S. There is no spatial y axis to integrate over; hemifield-separated and
    single-RF protocols vary only x and θ. With σ≈0 (CODE-014), saturation is
    driven entirely by this pooled S. NO per-panel suppressive gain or width
    scale (A-013).
  rationale: |
    The authors' code is now a Phase-A spec source. It computes the suppression
    exactly as EQ-5/EQ-6 (C-005/C-006) with a separable space×feature kernel
    (C-009 "Gaussian profiles in space and orientation"). The paper's "∫ s dx dθ
    = 1" (C-002) is a normalization idealization; the running code uses unit-volume
    separable Gaussians with a near-flat θ pool, and that — not any invented y
    plane or per-panel gain — is what produces the saturating CRFs of Figs 2–7.
    Both prior reconstructions failed because they kept a NARROW (180°) or
    effectively-1D θ pool; the code's flat 360° θ pool is the missing piece.
  alternatives_considered:
    - "RETIRED — 2D-(x,y) image-plane integral normalization (wrong form 2): empirically falsified in SQ-005, makes S smaller not larger."
    - "RETIRED — 1D-line pooling + a tuned suppression-normalization constant κ (the prior fallback): unnecessary; the code's broad-θ separable pool saturates with the cited/code constants, no κ."
    - "RETIRED — per-panel suppressive_drive_gain / suppressive_spatial_sigma_scale knobs (12/6/8/8/12; sigma-scale 0.45–1.0): figure-fitted, forbidden by A-013."
  affects:
    - "All simulation protocols (Figures 2 through 7)"
    - "pipeline.build_suppressive_kernel, pipeline.compute_suppressive_drive"
    - "EQ-6, EQ-suppressive_kernel (separable space×feature convolution, no y axis)"
    - "model_spec parameters.y_grid (DEPRECATED — no y dimension)"
    - "implementation/calibration.yaml: ALL figure_*.suppressive_drive_gain and suppressive_spatial_sigma_scale entries to be DELETED by Phase B; suppressive_tuning_width set to 360 globally; sigma set to 1e-6"
  spec_refs:
    - "components.suppressive_field"
    - "CODE-001, CODE-002, CODE-010, CODE-011, CODE-014"
    - "A-013 (forbids per-panel suppression knobs / test relaxation)"
    - "logs/spec_questions.md SQ-005 (resolution), SQ-001, SQ-002"

- id: A-007
  name: baseline_activity_values_figure_3
  description: |
    SUPERSEDED BY CODE (SQ-005; see CODE-017). The assumption was a single shared
    symmetric baseline (modulated = unmodulated = 0.05·α for both 3C and 3F). The
    authors' code (Figure3C.m / Figure3F.m) gives the actual numbers and they are
    NEITHER symmetric NOR identical across panels:
      3C: baselineMod = 5e-7 (added to E), baselineUnmod = 5 (added after norm).
      3F: baselineMod = 5e-7 (added to E), baselineUnmod = 0.
    The modulated baseline (5e-7) is tiny and SHARED; the per-panel difference is
    in the UNMODULATED post-normalization baseline (5 for 3C, 0 for 3F) — on an
    R-scale topping out ~20, the 3C unmodulated floor of 5 is large (the
    Reynolds-2000 additive-baseline pattern). Binding values now live in
    calibration.yaml (figure_3C/3F.baseline_modulated / baseline_unmodulated,
    source CODE-017). This is NOT a per-panel TUNING (A-013): it is the authors'
    own per-figure value read from their code, not a knob fit to a curve shape.
  rationale: |
    Baselines should be small relative to peak response (α) but visible at zero
    contrast; 5% of α is the conventional choice and is what the paper's "X"
    qualitatively requires (a low-contrast floor). The single 0.05·α value is
    a spec assumption (not a fit target): it is the SAME for 3C and 3F. The
    paper's only stated 3C-vs-3F difference is the stimulus/attention-field
    GEOMETRY and the presence of baseline — NOT a per-panel baseline magnitude
    (C-014). Per A-013 these baselines must NOT be re-tuned per panel to fit a
    curve shape, and tests must NOT be relaxed/tightened to admit a tuned value.
    (Phase-A-contract-update-2026-06-03: removed the prior "will be tuned
    per-protocol to match the qualitative shapes" license, which the
    CONTRACT_BUG finding flagged as figure-fitting; the per-panel
    baseline_modulated/unmodulated overrides in implementation/calibration.yaml,
    e.g. 3C/3F lowered 0.05→0.005, are to be DELETED by Phase B.)
  alternatives_considered:
    - "10–20% of α (larger baseline; risks dominating modulation pattern)"
    - "Asymmetric values for modulated vs unmodulated"
    - "Zero unmodulated baseline (only attention-modulated baseline)"
    - "RETIRED: per-panel-tuned baselines (3C/3F 0.005) — figure-fit, forbidden by A-013."
  affects:
    - "simulation_protocols.figure_3C"
    - "simulation_protocols.figure_3F"
    - "implementation/calibration.yaml: figure_3*.baseline_modulated_by_attention / baseline_unmodulated per-panel overrides to be DELETED by Phase B (use the single 0.05·α)"
  spec_refs:
    - "simulation_protocols.figure_3C.parameter_overrides"
    - "simulation_protocols.figure_3F.parameter_overrides"
    - "A-013 (forbids per-panel baseline tuning / test relaxation)"

- id: A-008
  name: orientation_discretization
  description: |
    Number of θ sample points is not specified. Use θ ∈ [-180°, 180°]
    with 73 points (5° spacing).
  rationale: |
    73 points across 360° gives 5° resolution — fine enough to resolve
    the narrowest tuning width (20° in Figs 4C/4E) with ≥4 samples per
    σ for direction-tuned protocols. The 360° range covers MT/MST
    motion directions; for V4 protocols spanning only 180° orientation
    space, the symmetry can be exploited but the same grid suffices.
  alternatives_considered:
    - "37 points (10° spacing) — coarse for tuning width 20°"
    - "361 points (1° spacing) — finer than needed; ~5× compute"
  affects:
    - "All orientation/direction convolutions and tuning curve outputs"
  spec_refs:
    - "parameters.theta_grid"

- id: A-009
  name: stimulus_drive_form
  description: |
    Paper does not give an explicit equation for E(x,θ); it only refers
    to the "stimulus drive" evoked by the stimulus and used as input to
    Eq. 1. Adopted form (EQ-stim): for a single grating at position
    x_0, contrast c, orientation θ_0:
        E(x,θ) = c · G_stim(x - x_0; σ_x = stimulus_size)
                   · G_orient(θ - θ_0; σ_θ = tuning_width)
    where G_* is the (unnormalized) Gaussian profile.
  rationale: |
    Standard interpretation in normalization models: stimulus drive is
    contrast-scaled product of spatial and orientation tuning, where
    the spatial extent of the drive is set by the *stimulus* size
    (which approximates how the stimulus interacts with the
    stimulation field). For multiple stimuli, E is the sum of per-
    stimulus contributions.
  alternatives_considered:
    - "E from explicit convolution of raw stimulus image with stimulation field (heavier; same outcome under our parameters)"
    - "Linear+nonlinear filtering with explicit RF shape"
  affects:
    - "All simulations (defines how stimulus parameters become E(x,θ))"
    - "EQ-stim"
  spec_refs:
    - "components.stimulation_field"
    - "equations.EQ-stim"

- id: A-011
  name: convolution_boundary_handling
  description: |
    CONFIRMED FROM CODE (SQ-005; CODE-003). Convolutions in EQ-6 use: CIRCULAR
    (periodic) convolution in feature θ; ZERO-PADDED convolution in space x. This
    is exactly conv2sepYcirc (attentionModel.m, CODE-001/CODE-003: upConv 'zero'
    for rows/x, 'circular' for cols/θ). There is no y axis (A-006 superseded).
  rationale: |
    θ is genuinely periodic (orientation: 180°; motion direction: 360°),
    so circular convolution preserves wrap-around contributions to
    suppression. The spatial axes x and y are not periodic — hemifield-
    separated stimuli should not "leak" suppression around the boundary, so
    zero-padding (or equivalently, large enough grid extent that boundaries
    are unreachable) is correct. Per A-005, both spatial grids extend well
    beyond any stimulus's footprint; combined with zero-padding, boundary
    effects are negligible.
  alternatives_considered:
    - "Periodic in x or y — would let opposite-hemifield stimuli wrap into the recorded RF"
    - "Zero-padded in θ — would lose suppressive contributions across the 180°/360° wrap"
    - "Reflect (mirror) boundaries in x/y"
  affects:
    - "EQ-2, EQ-6 (suppressive drive convolutions over the (x, y, θ) plane)"
    - "Pipeline step 4 (compute_suppressive_drive)"
  spec_refs:
    - "pipeline.compute_suppressive_drive"
    - "A-006 (2D-plane pooling)"

- id: A-012
  name: figure_4C_spatial_attention_facilitation
  description: |
    Figure 4C's "attend nonpreferred-in-RF" condition is a SPATIAL (location)
    attention cue to the receptive-field location (the Martinez-Trujillo &
    Treue 2002 task: attend that RF patch to detect a target). The attention
    field A(x,θ) is therefore a spatial Gaussian centered at x = 0 that is FLAT
    (uniform) over θ — it boosts the drives of BOTH colocated stimuli (the swept
    preferred at θ = 0 and the fixed nonpreferred at θ = 180°). This is the
    correct 4C mechanism; the result is contrast-gain FACILITATION (attended CRF
    above attend-away, leftward shift, positive % modulation peaking ~+36% at low
    contrast). The cited suppressive tuning width (180°, C-011) is used as-is;
    no per-protocol suppressive-tuning override is needed.
  rationale: |
    The paper resolves 4C internally to facilitation: the Fig-4 caption calls it
    a "contrast gain" change with a "percentage increase" in firing rate, C-019
    states the contrast-gain regime predicts a LEFTWARD shift, and the panel
    (panel_C.jpg / panel_C_digitized.json) shows the attended curve ABOVE
    attend-away with positive declining modulation. The two-stimulus-attention
    lineage (Martinez-Trujillo & Treue 2002; pestilli_ling_carrasco_2009;
    ghose_maunsell_2008; ni_maunsell_2017) is unanimous: spatial attention to the
    in-RF (nonpreferred) stimulus RAISES the recorded neuron's response. C-021
    ("yielding a smaller output firing rate") is the Fig-4E mechanism (attend
    preferred vs nonpreferred, contrasts covarying), NOT the 4C panel; applying
    it to 4C is the mis-mapping that produced the wrong (suppression) sign.
    See logs/faithfulness_audit/figure_4C_investigation-2026-06-03.md.
  alternatives_considered:
    - "Narrow feature-tuned attention field isolated on θ=180° (the RETIRED prior build): lands the gain on the nonpreferred population, feeds only the θ=0 neuron's suppressive pool → suppression / right-shift, the OPPOSITE of the paper's 4C panel. This is the 4E mechanism mis-applied to 4C."
    - "Per-protocol suppressive_tuning_width = 75° override (RETIRED SQ-004): a symptom of the wrong (suppression) regime; forced a fake 'recovery'. Removed — the spatial-attention regime saturates/recovers correctly with the cited 180°."
  affects:
    - "simulation_protocols.figure_4C (attention condition construction)"
    - "pipeline.build_attention_field (4C: spatial, feature-flat)"
    - "implementation/calibration.yaml: figure_4C.suppressive_tuning_width and figure_4C.sigma overrides to be DELETED by Phase B"
    - "extracted_data/test_figure_4C.py (Q-026/Q-027 facilitation direction); test_tier_figure_4.py (4C tier)"
  spec_refs:
    - "simulation_protocols.figure_4C"
    - "pseudocode/figure_4_protocol.md (Procedure 4C)"
    - "logs/spec_questions.md SQ-004 (resolution_2026-06-03)"

- id: A-010
  name: surround_suppression_scale_beta
  description: |
    Numeric value of β (surround suppression scale, 0 < β < 1) in
    Eqs. 4 and 8 is not given. Choose β = 1.0.
  rationale: |
    β = 1 yields full surround suppression; this is the natural
    interpretation when the suppressive field already determines
    suppression strength via convolution and there is no additional
    discount on surround contribution. β only appears in the
    closed-form approximations (EQ-4, EQ-8) used for analysis; the
    full population simulations (EQ-2, EQ-6) compute suppression
    through the suppressive field directly and do not use β.
  alternatives_considered:
    - "β = 0.5 (partial surround discount)"
    - "β derived from suppressive-field integral over surround region"
  affects:
    - "EQ-4, EQ-8 (analytical predictions only)"
  spec_refs:
    - "parameters.beta"

- id: A-013
  name: single_suppression_normalization_no_per_panel_tuning
  description: |
    BINDING CONTRACT RULE (phaseA-contract-update-2026-06-03, CONTRACT_BUG fix).
    The suppression normalization is ONE mechanism with ONE set of cross-figure
    constants, exactly as the paper has (C-010 suppressive_field_size = 20;
    C-011 suppressive_tuning_width = 180° V4 / doubled MT; EQ-2 ∫ s dx dθ = 1).
    The following are FORBIDDEN from the sanctioned-calibration surface and must
    not appear in article_aware/spec/calibration.yaml or be read by the model as
    scientific knobs:
      (1) per-panel suppressive_drive_gain (the RETIRED 12/6/8/8/12/8);
      (2) per-panel suppressive_spatial_sigma_scale (the RETIRED
          0.45/0.55/0.7/1.0);
      (3) per-panel baseline_modulated_by_attention / baseline_unmodulated
          values that differ across Fig-3 panels (use the single A-007 0.05·α);
      (4) per-panel sigma or suppressive_tuning_width overrides (the already-
          RETIRED SQ-004 figure_4C 75°/sigma override class).
    Tests MUST NOT be relaxed or tightened to admit a tuned value (the SQ-001
    record of relaxing the 2A %-mod-peak test to allow peak==0 and re-setting
    the saturation bounds so gain=4 fails / the tuned gain passes is the exact
    anti-pattern this rule bans). Saturation, percent-modulation-peak, and
    shape tests assert the paper's qualitative claim (C-019, C-020) against the
    SINGLE mechanism; the only sanctioned way to green them is the faithful
    suppression mechanism (A-006, resolved from code: SEPARABLE space×feature
    convolution with the cited/code constants — IxWidth=20, IthetaWidth=360,
    σ=1e-6), never a figure-fit.
    SQ-005 UPDATE (resolved from author code): the κ-fallback below is now MOOT.
    The code's separable broad-θ (360°) suppressive pool with σ≈0 saturates the
    CRFs directly from the single cited/code constants — no suppression-
    normalization constant κ is needed and none is added to calibration.yaml.
  rationale: |
    The CONTRACT_BUG finding: the per-panel suppression knobs and the
    test-relaxations are "the common Phase-A/contract origin of every magnitude
    divergence" (Figs 2–7). They are disclosed as audited:false (honest
    containment) but are a faithfulness hole for a normalization model whose
    magnitudes ARE the scientific claim. The fix is to specify the paper's one
    mechanism and forbid the per-panel knobs — never to tune to fit.
  alternatives_considered:
    - "Leave the per-panel knobs in implementation/calibration.yaml as audited:false honest-containment (REJECTED: the finding rules this a faithfulness hole, not acceptable containment, because the magnitudes are the scientific claim)."
  affects:
    - "article_aware/spec/calibration.yaml (no per-panel suppression/baseline entries; optionally ONE audited model.suppression_normalization)"
    - "implementation/calibration.yaml (all per-panel suppressive_drive_gain / suppressive_spatial_sigma_scale / per-panel baseline_* DELETED by Phase B)"
    - "extracted_data/test_contract_suppression_consistency.py (the single-value MUST-PASS invariant)"
    - "extracted_data/test_figure_2A.py, test_figure_4E.py and the tier tests (saturation / %-mod-peak bounds restored to the paper's qualitative claim, not the tuned-gain pass-band)"
  spec_refs:
    - "A-006 (the faithful 2D-plane suppression mechanism)"
    - "A-007 (single shared Fig-3 baseline)"
    - "logs/spec_questions.md SQ-001 (remediation_2026-06-03), SQ-002, SQ-004 (resolution_2026-06-03)"
    - "rendering_conventions / constants: C-010, C-011, C-019, C-020"
