figure: "Figure 5C — Spatial attention causes multiplicative scaling"
protocol_ref: figure_5C
notes: |
  Outputs: attended_tuning[θ_0], unattended_tuning[θ_0], ratio[θ_0] =
  attended / unattended.
  Spatial attention with broad orientation attention field should produce
  multiplicative scaling without changing tuning shape.

claims:
  - id: Q-033
    statement: "Attended tuning ≥ unattended tuning at every orientation."
    citation_ref: C-022
    reducible_to_deterministic: true
    deterministic_form: "(attended_tuning >= unattended_tuning).all()"

  - id: Q-034
    statement: |
      The ratio attended/unattended is approximately constant across
      orientation (multiplicative scaling, no shape change). max/min
      ratio across θ_0 < 1.3, restricting to orientations where
      unattended response is at least 5% of its peak.
    citation_ref: C-022
    reducible_to_deterministic: true
    deterministic_form: |
      mask = unattended_tuning > 0.05 * unattended_tuning.max()
      ratio[mask].max() / ratio[mask].min() < 1.3

  - id: Q-035
    statement: |
      Both tuning curves peak at the same orientation (the recorded
      neuron's preferred, θ_0 = 0).
    citation_ref: C-022
    reducible_to_deterministic: true
    deterministic_form: "abs(theta_0_grid[attended_tuning.argmax()] - theta_0_grid[unattended_tuning.argmax()]) < 5"

  - id: Q-036
    statement: |
      Tuning width (FWHM) is approximately equal between attended and
      unattended conditions (no sharpening; less than 20% relative
      difference).
    citation_ref: C-022
    reducible_to_deterministic: true
    deterministic_form: "abs(fwhm(attended_tuning, theta_0_grid) - fwhm(unattended_tuning, theta_0_grid)) / fwhm(unattended_tuning, theta_0_grid) < 0.2"
