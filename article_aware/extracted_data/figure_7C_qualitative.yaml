figure: "Figure 7C — Two stimuli in RF, three attention conditions"
protocol_ref: figure_7C
notes: |
  Outputs: fixation_tuning[θ_var], attend_nonpref_tuning[θ_var],
  attend_variable_tuning[θ_var].
  Three attention conditions on a recorded neuron with two stimuli in RF
  (one nonpreferred fixed, one variable direction).

claims:
  - id: Q-041
    statement: |
      Attending the variable stimulus produces larger responses near the
      preferred direction than the fixation baseline.
    citation_ref: C-021
    reducible_to_deterministic: true
    deterministic_form: "attend_variable_tuning[abs(theta_var_grid).argmin()] > fixation_tuning[abs(theta_var_grid).argmin()]"

  - id: Q-042
    statement: |
      Attending the nonpreferred stimulus produces smaller responses
      near the preferred direction than the fixation baseline.
    citation_ref: C-021
    reducible_to_deterministic: true
    deterministic_form: "attend_nonpref_tuning[abs(theta_var_grid).argmin()] < fixation_tuning[abs(theta_var_grid).argmin()]"

  - id: Q-043
    statement: |
      The attend_variable and attend_nonpref tuning curves shift the
      response profile in opposite directions relative to the fixation
      baseline (one boosts above, the other suppresses below, near the
      preferred direction).
    citation_ref: C-021
    reducible_to_deterministic: true
    deterministic_form: |
      idx_pref = abs(theta_var_grid).argmin()
      (attend_variable_tuning[idx_pref] - fixation_tuning[idx_pref]) * (attend_nonpref_tuning[idx_pref] - fixation_tuning[idx_pref]) < 0

  - id: Q-044
    statement: "All three tuning curves are non-negative everywhere."
    citation_ref: C-001
    reducible_to_deterministic: true
    deterministic_form: "(fixation_tuning >= 0).all() and (attend_nonpref_tuning >= 0).all() and (attend_variable_tuning >= 0).all()"
