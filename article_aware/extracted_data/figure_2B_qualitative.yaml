figure: "Figure 2B — Response Gain"
protocol_ref: figure_2B
notes: |
  Predicted regime (large stim, small attn field): response gain.
  Outputs: attended_CRF[c], unattended_CRF[c], percent_modulation[c].

claims:
  - id: Q-009
    statement: "Attended response ≥ unattended response at every contrast."
    citation_ref: C-021
    reducible_to_deterministic: true
    deterministic_form: "(attended_CRF >= unattended_CRF).all()"

  - id: Q-010
    statement: |
      Percent modulation does NOT peak at intermediate contrasts as in
      contrast-gain regime. The modulation at the highest contrast is at
      least 50% of the maximum modulation across the contrast range
      (i.e., still substantial at high contrast).
    citation_ref: C-019
    reducible_to_deterministic: true
    deterministic_form: "percent_modulation[-1] >= 0.5 * percent_modulation.max()"

  - id: Q-011
    statement: |
      Attended CRF is approximately a multiplicative scaling of unattended
      CRF: the ratio attended/unattended is roughly constant across
      contrast (max/min ratio < 1.5 across the swept range, excluding
      contrasts where unattended is below 1% of its peak to avoid
      division by near-zero).
    citation_ref: C-019
    reducible_to_deterministic: true
    deterministic_form: |
      ratio = attended_CRF / unattended_CRF
      mask = unattended_CRF > 0.01 * unattended_CRF.max()
      ratio[mask].max() / ratio[mask].min() < 1.5

  - id: Q-012
    statement: "Peak attended response > peak unattended response (upward shift)."
    citation_ref: C-019
    reducible_to_deterministic: true
    deterministic_form: "attended_CRF.max() > unattended_CRF.max()"

  - id: Q-013
    statement: "Both curves saturate at high contrast."
    citation_ref: C-020
    reducible_to_deterministic: true
    deterministic_form: "(attended_CRF[-1] - attended_CRF_at(0.5)) / attended_CRF_at(0.5) < 0.3"
