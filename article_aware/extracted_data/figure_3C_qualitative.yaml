figure: "Figure 3C — Reynolds 2000 reproduction (with baseline)"
protocol_ref: figure_3C
notes: |
  Outputs: attended_CRF[c], unattended_CRF[c], percent_modulation[c],
  absolute_difference[c] = attended - unattended.

claims:
  - id: Q-014
    statement: "Attended response ≥ unattended response at every contrast."
    citation_ref: C-021
    reducible_to_deterministic: true
    deterministic_form: "(attended_CRF >= unattended_CRF).all()"

  - id: Q-015
    statement: |
      Percent modulation is largest at low contrasts. Specifically, the
      argmax of percent_modulation is in the lower half of the contrast
      range.
    citation_ref: C-014
    reducible_to_deterministic: true
    deterministic_form: "percent_modulation.argmax() < len(percent_modulation) / 2"

  - id: Q-016
    statement: |
      Attended CRF is leftward-shifted vs unattended CRF on log-contrast
      axis (half-max contrast smaller for attended).
    citation_ref: C-014
    reducible_to_deterministic: true
    deterministic_form: "half_max_contrast(attended_CRF, c) < half_max_contrast(unattended_CRF, c)"

  - id: Q-017
    statement: |
      With baseline included, response at the smallest contrast in the
      sweep is positive (baseline visible).
    citation_ref: C-014
    reducible_to_deterministic: true
    deterministic_form: "attended_CRF[0] > 0 and unattended_CRF[0] > 0"

  - id: Q-018
    statement: "Both curves saturate at high contrast."
    citation_ref: C-020
    reducible_to_deterministic: true
    deterministic_form: "(attended_CRF[-1] - attended_CRF_at(0.5)) / attended_CRF_at(0.5) < 0.3"
