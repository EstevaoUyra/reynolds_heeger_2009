figure: "Figure 6C — Feature-based attention causes tuning sharpening"
protocol_ref: figure_6C
notes: |
  Outputs: attend_fixation_tuning[θ_stim],
  attend_opposite_stimulus_tuning[θ_stim].
  Feature-selective attention (matching the stimulus motion direction)
  sharpens (narrows) the tuning curve.

claims:
  - id: Q-037
    statement: |
      The attend_opposite_stimulus tuning curve is narrower (smaller
      FWHM) than the attend_fixation tuning curve.
    citation_ref: C-023
    reducible_to_deterministic: true
    deterministic_form: "fwhm(attend_opposite_stimulus_tuning, theta_stim_grid) < fwhm(attend_fixation_tuning, theta_stim_grid)"

  - id: Q-038
    statement: |
      Both tuning curves peak at the recorded neuron's preferred motion
      direction (θ = 0).
    citation_ref: C-023
    reducible_to_deterministic: true
    deterministic_form: "abs(theta_stim_grid[attend_fixation_tuning.argmax()]) < 15 and abs(theta_stim_grid[attend_opposite_stimulus_tuning.argmax()]) < 15"

  - id: Q-039
    statement: |
      Both tuning curves are non-negative everywhere.
    citation_ref: C-001
    reducible_to_deterministic: true
    deterministic_form: "(attend_fixation_tuning >= 0).all() and (attend_opposite_stimulus_tuning >= 0).all()"

  - id: Q-040
    statement: |
      The attend_opposite_stimulus tuning is larger near the preferred
      direction than the attend_fixation tuning (feature attention boosts
      preferred when stimulus direction matches).
    citation_ref: C-021
    reducible_to_deterministic: true
    deterministic_form: "attend_opposite_stimulus_tuning.max() > attend_fixation_tuning.max()"
