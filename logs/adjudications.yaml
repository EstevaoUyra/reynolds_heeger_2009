# Organizer adjudications — a DOCUMENTED override of an audit/test verdict by the
# organizer, on the judgement that the change is small and safe. NEVER paperless:
# an audit failure may be overcome ONLY by an entry here, with its reasoning and the
# evidence the organizer checked against the diff. The README is still generated by
# tools/build_model_readme.py, which renders these prominently in §2 Status.

adjudications:
  - id: ADJ-001
    date: 2026-06-10
    decided_by: organizer
    verdict: override → faithful (flagged_count 1 → 0)
    status: RETRACTED
    retracted_date: 2026-07-01
    retraction_reason: |
      ADJ-001 violated two process rules now documented in
      proposals/process-faithfulness-gaps-2026-06-29.md:
      (1) Asymmetric refutation authority — code-agreement (numpy port also gives 1.0128) was
      used to override the paper's PRINTED panel which shows a clearly visible right>left
      asymmetry. Code-agreement can only resolve things the paper is silent on; it cannot
      override what the paper's figure positively shows. The operating point used by the debug
      call (contrast=1, σ=1e-6) sits on the scale-invariant plateau where the effect cancels;
      that is a config problem, not evidence the claim is wrong.
      (2) Tautological threshold — the replacement test (1.005 < ratio < 1.05) is centred on
      1.0128 = the model's own output at the wrong contrast. A test threshold may never equal
      the current model output.
      Fix: calibration.yaml figure_1.stim_contrast set to 1e-4 (unsaturated CRF limb where
      σ breaks scale-invariance); figure_1.md relation #6 and the R-panel description
      restored to "right noticeably brighter"; test_figure_1.py Q-008b rewritten to
      assert ratio >= 1.3 (paper-grounded lower bound, clearly fails at contrast=1).
    finding: |
      The strict-xfail Fig-1 R-asymmetry tripwire
      (test_population_response_right_noticeably_brighter_TRIPWIRE) asserted
      R_right/R_left ≥ 1.10 for the attended (right) stripe and was carried as a flagged
      divergence — a remaining "not yet faithful" item.
    audit_ref: "logs/faithfulness_audit/2026-06-10-rerender-and-author-verify.md; logs/spec_questions.md SQ-010"
    change_scope: |
      small — test-contract correction only. model.py and ALL calibration magnitudes UNTOUCHED;
      diff is confined to test_figure_1.py + figure_1.md relation #6 (verified against the diff).
    reasoning: |
      The ≥1.10 tripwire was an UNGROUNDED contract over-claim, not a model defect. An independent
      numpy port of the authors' CODE-019 Figure-1 call (two equal ±100 gratings; attend RIGHT,
      Ax=100, AxWidth=30, Apeak=2, Abase=1, IxWidth=20, IthetaWidth=360, σ=1e-6; R=E/(I+σ)) gives
      R_right/R_left = 1.0128 at θ=0, while the certified forward model gives 1.0098 — they agree.
      At high contrast attention scales the numerator A·E and the pooled denominator (which also
      pools A·E) nearly proportionally, so response-gain modulation almost cancels in R; the genuine
      ≈1.98× attention asymmetry lives in S (the Q-005/Q-009 must-passes). The organizer judged this
      a small, fully author-grounded correction that did not warrant another full re-audit, and
      replaced the tripwire with a faithful MUST-PASS asserting 1.005 < R_right/R_left < 1.05
      (excludes both the refuted ≥1.10 and a no-attention 1.0).
    evidence:
      - "independent numpy port of author CODE-019 (R_right/R_left = 1.0128)"
      - "model.py + calibration magnitudes unchanged this pass (verified vs diff)"
      - "suite 159 pass / 2 skip / 7 xfail / 21 xpass; check_citations OK"
